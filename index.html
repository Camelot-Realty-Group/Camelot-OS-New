<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Camelot OS V10 - The Operating System for Property Management" />
    <title>Camelot OS V10</title>
    <script>
      // HashRouter ignores a real pathname. Legacy links such as
      // /instant-proposal?legacyRedirect=1 would otherwise load the home
      // screen (and, with a relative asset base, fail to load the bundle).
      (function () {
        try {
          var path = window.location.pathname || '/';
          if (path.length > 1 && path !== '/index.html') {
            var params = new URLSearchParams(window.location.search);
            if (!params.has('legacyRedirect')) params.set('legacyRedirect', '1');
            var hash = window.location.hash;
            if (!hash || hash === '#' || hash === '#/') {
              var clean = path.length > 1 && path.endsWith('/') ? path.slice(0, -1) : path;
              hash = '#' + clean;
            }
            var qs = params.toString();
            window.location.replace('/' + (qs ? '?' + qs : '') + hash);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
