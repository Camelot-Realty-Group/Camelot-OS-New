services:
  # Camelot OS — Node web service.
  # Runs server.js (Express): serves the built SPA from dist/ AND exposes the
  # /api/* backend (HubSpot sync, Apollo enrichment, Scout scan/report,
  # Daily Hunt trigger, building brand research).
  - type: web
    name: camelot-os-v10
    env: node
    plan: free # upgrade to "starter" to avoid cold starts
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: false
    envVars:
      # --- build-time flags (baked into the frontend bundle) ---
      - key: VITE_RUNTIME_MODE
        value: server # tells the SPA a Node backend is hosting it
      - key: VITE_DISABLE_SERVER_INTEGRATIONS
        value: "false"
      # --- Supabase (team logins + persistent data; app runs in demo mode without) ---
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Server-side copies are required to validate Supabase access tokens.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- server-side integration keys (set values in Render dashboard) ---
      - key: HUBSPOT_PRIVATE_APP_TOKEN
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: PROSPEO_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: SPIRE_MDS_API_KEY
        sync: false
      - key: SPIRE_MDS_CLIENT_SECRET
        sync: false
      # Configure these to create Traded NY opportunities in the sales pipeline.
      - key: HUBSPOT_DEAL_STAGE_ID
        sync: false
      - key: HUBSPOT_PIPELINE_ID
        sync: false
      - key: HUBSPOT_PORTAL_ID
        sync: false
      - key: HUBSPOT_CREATE_TASKS
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
