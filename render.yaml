services:
  # Camelot OS — Node web service.
  # Runs server.js (Express): serves the built SPA from dist/ AND exposes the
  # /api/* backend (HubSpot sync, Apollo enrichment, Scout scan/report,
  # Daily Hunt trigger, building brand research).
  - type: web
    name: camelot-os-v10
    env: node
    plan: free # upgrade to "starter" to avoid cold starts
    # --silent suppresses npm's "> command" banner lines, which npm prints
    # to stderr and Render's log viewer paints red as if they were errors.
    buildCommand: npm ci --no-audit --no-fund && npm run --silent build
    startCommand: npm start
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: false
    envVars:
      # --- build-time flags (baked into the frontend bundle) ---
      - key: VITE_RUNTIME_MODE
        value: server # tells the SPA a Node backend is hosting it
      - key: VITE_DISABLE_SERVER_INTEGRATIONS
        value: "false"
      # --- Supabase (team logins + persistent data; app runs in demo mode without) ---
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # --- server-side integration keys (set values in Render dashboard) ---
      - key: HUBSPOT_PRIVATE_APP_TOKEN
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      # optional: enable HubSpot deal sync
      # - key: HUBSPOT_DEAL_STAGE_ID
      #   sync: false
      # - key: HUBSPOT_PIPELINE_ID
      #   sync: false
